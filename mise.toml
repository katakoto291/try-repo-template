[tools]
node = "22"
pnpm = "11.18.0"

[tasks.check]
description = "Run biome check"
run = "biome check ."

[tasks.typecheck]
description = "Typecheck all workspaces via TypeScript project references"
run = "tsc -b"

[tasks.test]
description = "Run vitest across all workspaces"
run = "vitest run"

[tasks.setup-hooks]
description = "Install lefthook's git hooks (run once after clone)"
run = "pnpm exec lefthook install"
